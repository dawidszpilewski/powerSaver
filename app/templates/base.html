<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Usługa wyłączenia komputera{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <style>
        body {
            background: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            border-radius: 0.75rem;
            border: none;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }
        .table thead th {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .badge {
            font-size: 0.75rem;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
<div class="container py-4">
    <header class="text-center mb-4">
        <img src="{{ url_for('static', filename='primes.jpg') }}"
             alt="Logo"
             style="max-width: 420px; width: 100%; border-radius: 6px; box-shadow: 0 4px 12px rgba(15,23,42,.25);">
        <h1 class="mt-4 fw-bold">Usługa wyłączenia komputera</h1>
        <p class="text-muted mb-0">
            Automatyczne wyłączanie o 22:00 z możliwością zgłoszenia wyjątku oraz ręcznego sterowania.
        </p>
    </header>

    {% block content %}{% endblock %}
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
></script>
<script src="{{ url_for('static', filename='custom.js') }}"></script>

<script>
    // Globalne hasło admina – kopiowane do ukrytych pól w formularzach wymagających hasła
    (function () {
        const globalInput = document.getElementById('adminPasswordGlobal');
        if (!globalInput) return;

        function attachPasswordToForms() {
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', function (e) {
                    const needsPassword = form.querySelector('.admin-password-field');
                    if (!needsPassword) return;

                    if (!globalInput.value) {
                        e.preventDefault();
                        alert('Podaj najpierw hasło administratora.');
                        return;
                    }

                    needsPassword.value = globalInput.value;
                });
            });
        }

        document.addEventListener('DOMContentLoaded', attachPasswordToForms);
    })();
</script>
</body>
</html>
